[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hcltech-doc-extraction"
version = "0.1.0"
description = "Messy document extraction with human review - OCR and VLM extraction (Member 2)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pandas>=2.0",
    "pillow>=10.4",
    "pymupdf>=1.23",  # render PDF pages (Member 1 passes PDFs through unchanged)
    "python-dotenv>=1.0",
    "streamlit>=1.50",
]

[project.optional-dependencies]
# Heavy: only for running real OCR locally (not installed in CI).
ocr = ["paddleocr>=3.0", "paddlepaddle>=3.0"]
# Heavy: local Qwen2-VL. For CPU-only torch first run:
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
vlm = ["torch>=2.4", "torchvision>=0.19", "transformers>=4.45,<5", "accelerate>=0.33"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff==0.17.3",  # keep in sync with .pre-commit-config.yaml
    "mypy>=1.10",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
include = ["extraction*", "rules_engine*"]

[tool.setuptools]
py-modules = [
    "database",
    "exporter",
    "generate_sample_bills",
    "app",
    "pipeline",
    "preprocess",
    "review",
    "review_demo",
    "rules_integration",
    "sample_data",
    "validation",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]

[tool.ruff.format]
exclude = ["*.md"]  # don't reformat code snippets inside documentation

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
"test_*.py" = ["S101", "S106"]

[tool.mypy]
python_version = "3.10"
packages = ["extraction"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "rules_engine/tests", "test_preprocess.py"]
addopts = "--cov=extraction --cov-report=term-missing"
markers = ["integration: needs real PaddleOCR installed (skipped otherwise)"]

[tool.coverage.run]
branch = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
